[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "scripteer"
version = "1.6.0"
description = "Dependency-light building blocks for cohesive Python command-line tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "Pokanop Apps LLC"}]
keywords = ["cli", "command-line", "console", "framework", "toolkit", "scaffolding", "developer-tools"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: System :: Shells",
  "Topic :: Utilities",
]

[project.optional-dependencies]
ai-keyring = ["keyring>=25.7,<26"]
rich = ["rich>=13.9.4,<15"]
dev = ["build==1.6.1", "pytest==9.1.1", "pytest-cov==7.1.0", "mypy==2.4.0", "ruff==0.16.10", "diff-cover==10.6.0", "twine==6.2.0", "pip-audit==2.10.1", "jsonschema==4.26.0"]

[project.scripts]
scripteer = "scripteer.entrypoint:main"

[project.urls]
Homepage = "https://github.com/pokanop/scripteer"
Documentation = "https://github.com/pokanop/scripteer/tree/main/docs"
Repository = "https://github.com/pokanop/scripteer"
Issues = "https://github.com/pokanop/scripteer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"scripteer.contracts.resources" = ["*.json"]
"scripteer.generator.resources" = ["*.json"]
"scripteer.conformance.resources" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["src/scripteer"]
strict = true

# Imported 1.3.0 runtime: debt is explicit, not a wildcard covering future modules.
[[tool.mypy.overrides]]
module = ["scripteer.app", "scripteer.blocks", "scripteer.cli", "scripteer.config", "scripteer.console", "scripteer.doctor", "scripteer.proc", "scripteer.progress", "scripteer.style", "scripteer.tables", "scripteer.text", "scripteer"]
ignore_errors = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# Preserve the imported runtime byte-for-byte; new modules are checked by default.
exclude = ["src/scripteer/app.py", "src/scripteer/blocks.py", "src/scripteer/cli.py", "src/scripteer/config.py", "src/scripteer/console.py", "src/scripteer/doctor.py", "src/scripteer/proc.py", "src/scripteer/progress.py", "src/scripteer/style.py", "src/scripteer/tables.py", "src/scripteer/text.py", "src/scripteer/__init__.py"]

[tool.coverage.run]
source = ["scripteer"]
branch = true

[tool.coverage.report]
show_missing = true
